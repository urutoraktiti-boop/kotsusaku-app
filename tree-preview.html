<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>ツリーデザイン プレビュー</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #1a1a2e; color: #eee; font-family: sans-serif; padding: 20px; }
h1 { text-align: center; font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
.subtitle { text-align: center; font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }
.controls { text-align: center; margin-bottom: 24px; }
.controls label { font-size: 0.9rem; margin-right: 10px; }
#bloom-slider { width: 260px; vertical-align: middle; }
#bloom-val { display: inline-block; width: 40px; text-align: left; font-weight: bold; color: #ffd6e4; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
.card { background: #16213e; border-radius: 12px; padding: 12px; border: 1px solid #2a2a4a; }
.card-title { text-align: center; font-size: 0.95rem; margin-bottom: 6px; font-weight: bold; }
.card-sub { text-align: center; font-size: 0.72rem; color: #aaa; margin-bottom: 8px; }
.card svg { width: 100%; height: auto; display: block; }
.blossom-group { opacity: 0; transform-origin: center; transform: scale(0.6); transition: opacity 1.4s ease, transform 1.2s ease; }
.blossom-group.bloomed { opacity: 1; transform: scale(1); }
.full-bloom .blossom-group { filter: drop-shadow(0 0 8px var(--glow, rgba(255,150,180,0.55))); }
</style>
</head>

const grid = document.getElementById('grid');

stories.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-title">${s.name}</div>
    <div class="card-sub">${s.sub}</div>
    <svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax meet"
         id="svg-${s.id}" style="background:${s.bg}; border-radius:8px;">
      <defs>
        <filter id="bf-${s.id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
        <filter id="bf2-${s.id}" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <g class="tree-branches" fill="none" stroke-linecap="round" stroke-linejoin="round">
        ${makeBranches(s.trunk, s.shape)}
      </g>
      ${makeBlossoms(s.blossoms, s.shape).replace(/url\(#bf\)/g, `url(#bf-${s.id})`).replace(/url\(#bf2\)/g, `url(#bf2-${s.id})`)}
    </svg>
  `;
  card.dataset.glow = s.glow;
  card.dataset.id = s.id;
  grid.appendChild(card);
});

function updateBloom(pct) {
  document.querySelectorAll('.card').forEach(card => {
    const id = card.dataset.id;
    const glow = card.dataset.glow;
    const svg = card.querySelector('svg');
    const stages = Math.floor(pct / 10);
    let isFullBloom = pct >= 100;
    svg.style.setProperty('--glow', glow);

    for (let i = 1; i <= 10; i++) {
      const g = svg.querySelector(`#bg${i}`);
      if (!g) continue;
      if (i <= stages) {
        g.classList.add('bloomed');
      } else {
        g.classList.remove('bloomed');
      }
    }

    if (isFullBloom) svg.classList.add('full-bloom');
    else svg.classList.remove('full-bloom');
  });
}

const slider = document.getElementById('bloom-slider');
const val = document.getElementById('bloom-val');
slider.addEventListener('input', () => {
  val.textContent = slider.value + '%';
  updateBloom(parseInt(slider.value));
});

updateBloom(0);
