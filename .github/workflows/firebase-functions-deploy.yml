# サーバー側のプログラム（Cloud Functions）を、GitHubの画面のボタンから
# 本番へ反映（デプロイ）するための設定です。ターミナルを使わずに実行できます。
#
# 【使い方】
#   1. GitHub のリポジトリ画面上部の「Actions」タブを開く
#   2. 左側の一覧から「サーバー側（Functions）をデプロイ」を選ぶ
#   3. 右側の「Run workflow」ボタン → 緑の「Run workflow」を押す
#   4. 2〜5分待つ。緑のチェックが付けば成功
#
# 【自動では実行されません】
#   アプリ本体（firebase-hosting-deploy.yml）は main に変更が入ると自動で反映されますが、
#   サーバー側は「押したときだけ」動きます。意図せず本番のプログラムが
#   入れ替わるのを防ぐためです。
#
# 【必要な準備】
#   GitHub の Settings → Secrets and variables → Actions に登録した
#   FIREBASE_SERVICE_ACCOUNT（Firebaseのサービスアカウント鍵JSON）を使います。
#   アプリ本体のデプロイと同じものを使い回します。
#
#   ただし、Functions のデプロイはアプリ本体より強い権限を必要とします。
#   権限が足りない場合は下のような赤いエラーで止まります。
#     Error: Request to ... had HTTP Error: 403, Permission ... denied
#   そのときは Google Cloud のコンソールで、このサービスアカウントに次の役割を追加してください。
#     ・Cloud Functions 管理者      (roles/cloudfunctions.admin)
#     ・サービス アカウント ユーザー (roles/iam.serviceAccountUser)
#     ・Cloud Build 編集者          (roles/cloudbuild.builds.editor)
#     ・Artifact Registry 管理者     (roles/artifactregistry.admin)
#     ・Cloud Run 管理者            (roles/run.admin)
#     ・Eventarc 管理者             (roles/eventarc.admin)
#   （毎時実行の集計は第2世代の関数のため、Cloud Run と Eventarc の権限も必要です）

name: サーバー側（Functions）をデプロイ

on:
  workflow_dispatch: # 画面の「Run workflow」ボタンを押したときだけ実行する

# 同時に2回走ると本番のプログラムが競合するため、1本ずつ順番に実行する
concurrency:
  group: firebase-functions-deploy
  cancel-in-progress: false

jobs:
  deploy_functions:
    runs-on: ubuntu-latest
    steps:
      - name: コードを取得
        uses: actions/checkout@v4

      - name: Node.js を準備
        # functions/package.json の engines に合わせて 20 を使う
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: サーバー側プログラムの部品を入れる
        # functions/node_modules はGitHubに置かない決まりなので、取得直後は空。
        # 部品が無いと firebase-tools がプログラムを解析できず、
        # 「Couldn't find firebase-functions package in your source code」で失敗する。
        # functions/package-lock.json は無いため npm ci ではなく npm install を使う。
        run: npm install --prefix functions

      - name: 送り込む前に文法をチェック
        # 文法が壊れたまま本番へ送らないための確認。ここで止まれば本番は無傷。
        run: node --check functions/index.js

      - name: プログラムが読み込めるか確認
        # 文法チェックだけでは、部品の不足や読み込み時のエラーを検出できない（教訓#004）。
        # 実際に読み込んで、公開すべき関数がそろっているかまで確かめる。
        run: |
          node -e "
          const m = require('./functions/index.js');
          const names = Object.keys(m);
          console.log('公開されている関数:', names.join(', '));
          for (const need of ['runAggregateNow', 'snapshotTaskTrend']) {
            if (!names.includes(need)) {
              console.error('関数が見つかりません: ' + need);
              process.exit(1);
            }
          }
          "

      - name: Functions へデプロイ（失敗時は自動で最大3回リトライ）
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 20
          command: |
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
            npx firebase-tools@latest deploy --only functions --project kotsusaku-app --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 鍵ファイルを消す
        # 失敗した場合も必ず消す
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
